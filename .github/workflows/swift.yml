name: Avenue CI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: avenue-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Build and Package DMG (${{ matrix.arch }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
            build_archs: x86_64
          - runner: macos-15
            arch: arm64
            build_archs: arm64
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_ARCHS: ${{ matrix.build_archs }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.x
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^16.0.0"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Prepare diagnostic paths
        shell: bash
        run: |
          echo "BUILD_LOG=$RUNNER_TEMP/Avenue-${BUILD_ARCH}.build.log" >> "$GITHUB_ENV"
          echo "RESULT_BUNDLE=$RUNNER_TEMP/Avenue-${BUILD_ARCH}.xcresult" >> "$GITHUB_ENV"

      - name: Build (Release, ad-hoc signed)
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/AvenueDD"
          rm -rf "$DERIVED_DATA" "$RESULT_BUNDLE"
          : > "$BUILD_LOG"

          xcodebuild \
            -project "Avenue.xcodeproj" \
            -scheme "Avenue" \
            -configuration "Release" \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            ARCHS="$BUILD_ARCHS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES \
            clean build 2>&1 | tee "$BUILD_LOG"

          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Release" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Release app bundle was not found."
            exit 1
          fi

          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$APP_VERSION" != "$TAG_VERSION" ]]; then
              echo "Tag version mismatch: tag=$TAG_VERSION, CFBundleShortVersionString=$APP_VERSION"
              exit 1
            fi
          fi

          MIN_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP_PATH/Contents/Info.plist")"
          IFS='.' read -r major minor patch <<< "$MIN_VERSION"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          numeric_version="$((major * 10000 + minor * 100 + patch))"
          min_required_numeric="$((10 * 10000 + 15 * 100 + 0))"

          if (( numeric_version < min_required_numeric )); then
            echo "Expected LSMinimumSystemVersion >= 10.15, got $MIN_VERSION"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Avenue-build-diagnostics-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.RESULT_BUNDLE }}
          if-no-files-found: warn
          retention-days: 14

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/dmg-root"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          cp -R "$APP_PATH" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            RELEASE_VERSION="sha-${SHORT_SHA}"
          fi

          DMG_NAME="Avenue-Extended-${RELEASE_VERSION}-${BUILD_ARCH}.dmg"
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"

          hdiutil create \
            -volname "Avenue Extended" \
            -srcfolder "$STAGE_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: mac
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Avenue-Extended-*
          path: dist
          merge-multiple: true

      - name: List downloaded assets
        run: ls -lah dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
